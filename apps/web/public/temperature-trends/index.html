<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131f">
<title>TempLens Pro — Loading</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 5%,#103c5f 0,transparent 35%),radial-gradient(circle at 90% 5%,#312d6655 0,transparent 36%),#07131f;color:#effaff}.card{width:min(92vw,460px);padding:32px;border:1px solid #29475e;border-radius:28px;background:#0b1c2bdd;box-shadow:0 30px 90px #0008;text-align:center}.mark{width:70px;height:70px;margin:0 auto 20px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#52e7ff,#8b6cff);color:#07131f;font-weight:900;font-size:30px}.spinner{width:38px;height:38px;margin:22px auto 0;border:3px solid #29475e;border-top-color:#52e7ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(1turn)}}p{color:#9db4c7;line-height:1.6}.error{color:#ffb08a}button{margin-top:14px;border:0;border-radius:12px;padding:12px 18px;background:#52e7ff;color:#07131f;font-weight:800;cursor:pointer}[hidden]{display:none}
</style>
</head>
<body>
<main class="card">
<div class="mark">T</div>
<h1>Opening TempLens Pro</h1>
<p id="status">Loading the advanced weather dashboard…</p>
<div class="spinner" id="spinner"></div>
<button id="retry" hidden>Retry</button>
</main>
<script>
(async()=>{const status=document.getElementById('status'),retry=document.getElementById('retry'),spinner=document.getElementById('spinner');try{if(!('DecompressionStream'in window))throw new Error('This browser is too old for the upgraded dashboard.');const names=Array.from({length:6},(_,i)=>`payload-0${i+1}.txt`);const responses=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'})));if(responses.some(r=>!r.ok))throw new Error('Some dashboard files could not be loaded.');const text=(await Promise.all(responses.map(r=>r.text()))).join('');const raw=Uint8Array.from(atob(text),c=>c.charCodeAt(0));const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(error){console.error(error);status.className='error';status.textContent=error.message||'The dashboard could not start.';spinner.hidden=true;retry.hidden=false;retry.onclick=()=>location.reload()}})();
</script>
</body>
</html>
