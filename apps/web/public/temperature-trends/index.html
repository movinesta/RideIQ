<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07131f"><title>TempLens Pro — Loading</title>
<style>:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 5%,#103c5f 0,transparent 35%),radial-gradient(circle at 90% 5%,#312d6655 0,transparent 36%),#07131f;color:#effaff}.card{width:min(92vw,460px);padding:32px;border:1px solid #29475e;border-radius:28px;background:#0b1c2bdd;box-shadow:0 30px 90px #0008;text-align:center}.mark{width:70px;height:70px;margin:0 auto 20px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#52e7ff,#8b6cff);color:#07131f;font-weight:900;font-size:30px}.spinner{width:38px;height:38px;margin:22px auto 0;border:3px solid #29475e;border-top-color:#52e7ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(1turn)}}p{color:#9db4c7;line-height:1.6}.error{color:#ffb08a}button{margin-top:14px;border:0;border-radius:12px;padding:12px 18px;background:#52e7ff;color:#07131f;font-weight:800;cursor:pointer}[hidden]{display:none}</style>
</head>
<body><main class="card"><div class="mark">T</div><h1>Opening TempLens Pro</h1><p id="status">Loading the mobile-optimized weather dashboard…</p><div class="spinner" id="spinner"></div><button id="retry" hidden>Retry</button></main>
<script>(async()=>{const status=document.getElementById('status'),retry=document.getElementById('retry'),spinner=document.getElementById('spinner');try{if(!('DecompressionStream'in window))throw new Error('This browser is too old for the upgraded dashboard.');const names=Array.from({length:6},(_,i)=>`payload-0${i+1}.txt`);const responses=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'})));if(responses.some(r=>!r.ok))throw new Error('Some dashboard files could not be loaded.');const text=(await Promise.all(responses.map(r=>r.text()))).join('');const raw=Uint8Array.from(atob(text),c=>c.charCodeAt(0));const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();const js="(()=>{\n  const setup=()=>{\n    const hero=document.querySelector('.hero');\n    if(hero&&!document.querySelector('.mobile-jumpbar')){\n      const nav=document.createElement('nav');\n      nav.className='mobile-jumpbar';\n      nav.setAttribute('aria-label','Quick section navigation');\n      nav.innerHTML='<a href=\"#locationForm\">Search</a><a href=\"#overview\">Now</a><a href=\"#trendChartTitle\">Charts</a><a href=\"#hourlyTitle\">72 hours</a><a href=\"#dailyTitle\">15 days</a>';\n      hero.after(nav);\n    }\n    const footer=document.querySelector('.footer');\n    if(footer&&!document.querySelector('.mobile-dock')){\n      const dock=document.createElement('nav');\n      dock.className='mobile-dock';\n      dock.setAttribute('aria-label','Quick mobile navigation');\n      dock.innerHTML='<a href=\"#locationForm\"><span>⌕</span><small>Search</small></a><a href=\"#overview\"><span>◉</span><small>Now</small></a><a href=\"#trendChartTitle\"><span>∿</span><small>Charts</small></a><a href=\"#hourlyTitle\"><span>◷</span><small>72h</small></a><a href=\"#dailyTitle\"><span>≡</span><small>15 days</small></a>';\n      footer.before(dock);\n    }\n    const labels=['Day','Period','Conditions','High','Mean','Low','Rain','Wind','Daily change','Vs last year'];\n    const body=document.getElementById('dailyTableBody');\n    const labelRows=()=>body?.querySelectorAll('tr').forEach(row=>row.querySelectorAll('td').forEach((cell,index)=>cell.dataset.label=labels[index]||''));\n    labelRows();\n    if(body&&!body.dataset.mobileObserved){body.dataset.mobileObserved='true';new MutationObserver(labelRows).observe(body,{childList:true,subtree:true});}\n  };\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup,{once:true});else setup();\n})();";const enhanced=html.replace('</head>','<link rel="stylesheet" href="mobile-redesign.css?v=3"></head>').replace('</body>',`<script>${js}<\/script></body>`);document.open();document.write(enhanced);document.close()}catch(error){console.error(error);status.className='error';status.textContent=error.message||'The dashboard could not start.';spinner.hidden=true;retry.hidden=false;retry.onclick=()=>location.reload()}})();</script></body></html>
