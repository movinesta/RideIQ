name: seed-iraq-service-areas

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, do not write to DB (logs only)."
        required: true
        default: true
        type: boolean
      pricing_config_id:
        description: "Optional: force a pricing_config_id (UUID). Leave blank to auto-pick default."
        required: false
        default: ""
        type: string
      cash_step_iqd:
        description: "Default cash rounding step for all zones (IQD)."
        required: true
        default: "250"
        type: string

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: seed-iraq-service-areas
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Install pnpm FIRST so setup-node cache: pnpm can call pnpm.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # If your repo has "packageManager": "pnpm@X.Y.Z" in package.json,
          # you can omit version and pnpm/action-setup will use it. :contentReference[oaicite:1]{index=1}
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Show versions
        run: |
          node -v
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run seed (HDX COD-AB -> service_areas)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PRICING_CONFIG_ID: ${{ inputs.pricing_config_id }}
          CASH_STEP_IQD: ${{ inputs.cash_step_iqd }}
        run: pnpm -C apps/web seed:iraq:areas
