name: seed-iraq-service-areas

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, do not write to DB (logs only)."
        required: true
        default: true
        type: boolean
      pricing_config_id:
        description: "Optional: force a pricing_config_id (UUID). Leave blank to auto-pick default."
        required: false
        default: ""
        type: string
      cash_step_iqd:
        description: "Default cash rounding step for all zones (IQD)."
        required: true
        default: "250"
        type: string
      cash_step_baghdad:
        description: "Optional override for Baghdad cash rounding step (IQD)."
        required: false
        default: ""
        type: string
      cash_step_karbala:
        description: "Optional override for Karbala cash rounding step (IQD)."
        required: false
        default: ""
        type: string

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Minimal permissions: we only need to read repo content.
    permissions:
      contents: read

    # Prevent concurrent runs clobbering each other.
    concurrency:
      group: seed-iraq-service-areas
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Configure npm registry (avoid flaky installs)
        run: |
          npm config set registry https://registry.npmjs.org/
          pnpm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 600000

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run seed (HDX COD-AB -> service_areas)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # Inputs -> script env
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

          # If provided as input, use it. Otherwise script auto-selects default.
          PRICING_CONFIG_ID: ${{ inputs.pricing_config_id }}

          CASH_STEP_IQD: ${{ inputs.cash_step_iqd }}

          # Optional per-governorate overrides (script supports these exact names).
          CASH_STEP_BAGHDAD: ${{ inputs.cash_step_baghdad }}
          CASH_STEP_KARBALA: ${{ inputs.cash_step_karbala }}
        run: |
          echo "Running seed script..."
          echo "DRY_RUN=$DRY_RUN"
          pnpm -C apps/web seed:iraq:areas
