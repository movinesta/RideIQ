name: seed-iraq-service-areas

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, logs what would be inserted without writing to the DB'
        required: false
        default: 'false'
      seed_admin_level:
        description: 'Admin level to seed: 3=ADM3 sub-districts (most accurate), 2=ADM2 districts, 1=ADM1 governorates'
        required: false
        default: '3'
      pricing_config_id:
        description: 'Optional pricing_configs.id to attach to created service areas'
        required: false
        default: ''

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed Iraq service areas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          SEED_ADMIN_LEVEL: ${{ inputs.seed_admin_level }}
          PRICING_CONFIG_ID: ${{ inputs.pricing_config_id }}
        run: pnpm -C apps/web seed:iraq:areas
