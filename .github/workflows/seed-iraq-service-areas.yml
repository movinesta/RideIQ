name: seed-iraq-service-areas

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, logs what would be inserted without writing to the DB'
        required: true
        default: true
        type: boolean
      seed_admin_level:
        description: 'Admin level to seed: 3=ADM3 sub-districts (areas), 2=ADM2 districts, 1=ADM1 governorates'
        required: true
        default: '3'
        type: choice
        options:
          - '3'
          - '2'
          - '1'
      pricing_config_id:
        description: 'Optional pricing_configs.id UUID to attach to created service areas (blank = auto-pick default active)'
        required: false
        default: ''

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install pnpm first so setup-node's pnpm caching can call `pnpm store path`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Ensure unzip exists
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Validate required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Preferred: SUPABASE_SERVICE_ROLE_KEY (may be sb_secret_... or legacy service_role JWT)
          # Alias: SUPABASE_SECRET_KEY
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Missing secret SUPABASE_URL"; exit 1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -z "$SUPABASE_SECRET_KEY" ]; then echo "Missing secret SUPABASE_SERVICE_ROLE_KEY (or alias SUPABASE_SECRET_KEY)"; exit 1; fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed Iraq service areas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          # Alias for older scripts / external tooling.
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          SEED_ADMIN_LEVEL: ${{ inputs.seed_admin_level }}
          PRICING_CONFIG_ID: ${{ inputs.pricing_config_id }}
        run: pnpm -C apps/web seed:iraq:areas
