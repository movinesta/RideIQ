name: deploy-supabase-functions

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Create this token in Supabase Dashboard (Account Settings -> Access Tokens)
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Your Supabase project ref, e.g. `ehtimvlmpghstlzvfipx`
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Optional, but recommended for stronger env mismatch checks.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      AUTH_HOOK_SEND_SMS_SECRET: ${{ secrets.AUTH_HOOK_SEND_SMS_SECRET }}
      AUTH_HOOK_SECRET: ${{ secrets.AUTH_HOOK_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Supabase environment selection
        run: node scripts/audit-supabase-env.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Since Supabase CLI v1.62.0 you can deploy all functions with a single command.
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref $SUPABASE_PROJECT_REF
